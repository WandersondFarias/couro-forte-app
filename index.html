<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a2814">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Couro Forte">
<title>Couro Forte — Catálogo e Pedidos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
<script>try{var t=JSON.parse(localStorage.getItem('courofort_app_v1')||'{}').config||{};document.documentElement.dataset.tema=t.tema||(matchMedia('(prefers-color-scheme: dark)').matches?'escuro':'claro')}catch(e){document.documentElement.dataset.tema='claro'}</script>
</head>
<body>

<header class="topo">
  <img src="img/logo.png" alt="Botinas Couro Forte" class="logo">
  <div class="topo-info">
    <span id="topoTitulo">Catálogo</span>
    <small id="topoRep"></small>
  </div>
  <div class="tema" role="group" aria-label="Aparência">
    <button id="temaClaro" title="Modo claro" aria-label="Modo claro">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
      <span>Claro</span></button>
    <button id="temaEscuro" title="Modo escuro" aria-label="Modo escuro">
      <svg viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
      <span>Escuro</span></button>
  </div>
  <nav class="abas">
    <button data-tela="catalogo" class="ativa">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg><span>Catálogo</span></button>
    <button data-tela="pedido">
      <svg viewBox="0 0 24 24"><path d="M3 4h2.2l2.2 11.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1L21 8H6.1"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg><span>Fazer Pedido</span><b id="badge" class="badge" hidden>0</b></button>
    <button data-tela="historico">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg><span>Histórico</span></button>
    <button data-tela="config">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Ajustes</span></button>
  </nav>
</header>

<main id="app">

  <!-- CATÁLOGO -->
  <section id="tela-catalogo" class="tela ativa">
    <div class="busca">
      <input type="search" id="busca" placeholder="Buscar por referência, couro, cor…" autocomplete="off">
    </div>
    <div class="secoes-wrap"><nav class="secoes" id="secoes"></nav></div>
    <div id="listaCatalogo"></div>
  </section>

  <!-- PEDIDO ATUAL -->
  <section id="tela-pedido" class="tela">
    <div id="pedidoConteudo"></div>
  </section>

  <!-- HISTÓRICO -->
  <section id="tela-historico" class="tela">
    <div class="busca">
      <input type="search" id="buscaHist" placeholder="Buscar pedido por cliente ou número…" autocomplete="off">
    </div>
    <div id="listaHistorico"></div>
  </section>

  <!-- CONFIGURAÇÕES -->
  <section id="tela-config" class="tela">
    <div id="configConteudo"></div>
  </section>
</main>



<button id="paraTopo" class="para-topo" aria-label="Voltar ao topo" title="Voltar ao topo">
  <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>

<!-- Folha do produto (grade de numeração) -->
<div id="folha" class="folha" hidden>
  <div class="folha-fundo" data-fechar></div>
  <div class="folha-corpo" id="folhaCorpo"></div>
</div>

<!-- Visualizador de foto -->
<div id="zoom" class="zoom" hidden><img id="zoomImg" alt=""><button class="zoom-x" aria-label="Fechar">✕</button></div>

<div id="dialogo" class="dialogo" hidden></div>

<div id="aviso" class="aviso"></div>

<!-- Área usada para imprimir / salvar PDF -->
<div id="impressao"></div>

<script src="catalogo.js"></script>
<script src="cidades.js"></script>
<script src="lib/xlsx.mini.min.js"></script>
<script src="app.js"></script>
</body>
</html>
